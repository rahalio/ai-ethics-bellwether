openapi: 3.0.3
info:
  title: Bellwether
  version: 0.1.0
  description: >-
    Board-level radar for disruptive technology decisions. Scores exposure across
    commoditisation, consent, displacement, bias and inclusion, and accessibility;
    records necessary versus unnecessary harms, mitigations, acceptances and the
    short-term sacrifice the board accepted.
  x-product-slug: ai-ethics-bellwether
  x-source: ai-in-ethics/deloitte-ethics-in-the-age-of-disruption/
servers:
  - url: https://api.example.com
tags:
  - name: Decisions
    description: Technology decisions, materiality and options
  - name: Harm Assessment
    description: Per-domain harm itemisation and classification
  - name: Exposure
    description: Continuous exposure scores by domain and stakeholder group
  - name: Sacrifice Ledger
    description: Short-term sacrifices and horizon reviews
  - name: Consent Adequacy
    description: Comprehension evidence and unconsented uses
  - name: Displacement
    description: Transition plans and consultation records
  - name: Access & Equity
    description: Distributional assessments and access commitments
  - name: Policy Posture
    description: Stated positions and lead-match-trail assessment
  - name: Engagement
    description: Multi-stakeholder engagements and outcomes
  - name: Conscience Channel
    description: Compartmented reports of commercial pressure overriding ethics
  - name: Trust
    description: Per-group trust and comprehension measures
  - name: Board Record
    description: Append-only decisions, dissent and delegated authorities
paths:
  /v1/decisions:
    get:
      operationId: listTechnologyDecisions
      tags: [Decisions]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, assessing, ready_for_committee, approved, rejected, proceeded_without_assessment]
      responses:
        "200":
          description: Technology decisions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTechnologyDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerTechnologyDecision
      tags: [Decisions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnologyDecisionCreate"
      responses:
        "201":
          description: Decision registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTechnologyDecision"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/decisions/{decisionId}:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    get:
      operationId: getTechnologyDecision
      tags: [Decisions]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Technology decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTechnologyDecision"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/decisions/{decisionId}/materiality:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    post:
      operationId: assessMateriality
      tags: [Decisions]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialityAssessment"
      responses:
        "200":
          description: Materiality assessment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMaterialityAssessment"
  /v1/decisions/{decisionId}/options:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    post:
      operationId: addDecisionOption
      tags: [Decisions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionOption"
      responses:
        "201":
          description: Alternative option recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDecisionOption"
  /v1/decisions/{decisionId}/harm-assessments:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    get:
      operationId: listHarmAssessments
      tags: [Harm Assessment]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Harm assessments for the decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeHarmAssessment"
    post:
      operationId: createHarmAssessment
      tags: [Harm Assessment]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarmAssessmentCreate"
      responses:
        "201":
          description: Harm assessment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHarmAssessment"
  /v1/harm-items/{harmItemId}/classify:
    parameters:
      - $ref: "#/components/parameters/HarmItemId"
    post:
      operationId: classifyHarmItem
      tags: [Harm Assessment]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classification, rationale]
              properties:
                classification:
                  type: string
                  enum: [necessary, unnecessary]
                rationale:
                  type: string
                contested:
                  type: boolean
      responses:
        "200":
          description: Harm classification recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHarmItem"
  /v1/harm-items/{harmItemId}/mitigations:
    parameters:
      - $ref: "#/components/parameters/HarmItemId"
    post:
      operationId: assignMitigation
      tags: [Harm Assessment]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mitigation"
      responses:
        "201":
          description: Mitigation assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeMitigation"
  /v1/harm-items/{harmItemId}/acceptances:
    parameters:
      - $ref: "#/components/parameters/HarmItemId"
    post:
      operationId: acceptHarm
      tags: [Harm Assessment]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarmAcceptance"
      responses:
        "201":
          description: Harm acceptance recorded by named executive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHarmAcceptance"
  /v1/exposure-scores:
