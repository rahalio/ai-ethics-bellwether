      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: domain
          in: query
          schema:
            $ref: "#/components/schemas/ExposureDomain"
        - name: stakeholderGroupId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Exposure scores page
          content:
            application/json:
              schema:
