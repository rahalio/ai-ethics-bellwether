    post:
      operationId: grantDelegatedAuthority
      tags: [Board Record]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegatedAuthority"
      responses:
        "201":
          description: Delegated authority granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDelegatedAuthority"
  /v1/stakeholder-groups:
