components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        type: string
    HarmItemId:
      name: harmItemId
      in: path
      required: true
      schema:
        type: string
    SacrificeEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
    DisplacementPlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
    PolicyPositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
    EngagementId:
      name: engagementId
      in: path
      required: true
      schema:
        type: string
    ConscienceReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
    BoardRecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    ExposureDomain:
      type: string
      enum:
        - commoditisation_of_human_experience
        - consent_and_privacy
        - worker_displacement
        - bias_and_inclusion
        - accessibility_and_inequality
    TechnologyDecisionCreate:
      type: object
      required: [title, proposingUnitId, summary]
      properties:
        title:
          type: string
        proposingUnitId:
          type: string
        summary:
          type: string
        capitalCommitted:
          type: number
        employeesAffected:
          type: integer
        customersAffected:
          type: integer
        adoptionPace:
          type: string
          enum: [incremental, full_scale]
    TechnologyDecision:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
        title:
          type: string
        proposingUnitId:
          type: string
        summary:
          type: string
        status:
