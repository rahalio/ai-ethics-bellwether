      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Engagements page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeStakeholderEngagement"
    post:
      operationId: recordStakeholderEngagement
      tags: [Engagement]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakeholderEngagementCreate"
      responses:
        "201":
          description: Engagement recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStakeholderEngagement"
  /v1/engagements/{engagementId}/outcomes:
    parameters:
      - $ref: "#/components/parameters/EngagementId"
    post:
      operationId: recordEngagementOutcome
      tags: [Engagement]
      security:
