    post:
      operationId: adoptPolicyPosition
      tags: [Policy Posture]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyPositionCreate"
      responses:
        "201":
          description: Policy position adopted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopePolicyPosition"
  /v1/policy-positions/{positionId}/lead-lag:
    parameters:
      - $ref: "#/components/parameters/PolicyPositionId"
    post:
      operationId: assessRegulatoryLeadLag
      tags: [Policy Posture]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegulatoryLeadLagAssessment"
      responses:
        "200":
          description: Lead-match-trail assessment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRegulatoryLeadLagAssessment"
  /v1/engagements:
    get:
      operationId: listStakeholderEngagements
      tags: [Engagement]
      security:
