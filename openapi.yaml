          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSacrificeLedgerEntry"
    post:
      operationId: recordSacrifice
      tags: [Sacrifice Ledger]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SacrificeLedgerEntryCreate"
      responses:
        "201":
          description: Sacrifice recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSacrificeLedgerEntry"
  /v1/sacrifice-ledger/{entryId}/horizon-reviews:
    parameters:
      - $ref: "#/components/parameters/SacrificeEntryId"
    post:
      operationId: recordHorizonReview
      tags: [Sacrifice Ledger]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HorizonReview"
      responses:
        "201":
          description: Horizon review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHorizonReview"
  /v1/consent-adequacy:
    get:
      operationId: listConsentAdequacyMeasures
